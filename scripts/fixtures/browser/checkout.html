<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Checkout — Acme Store</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 24px; }
      .cols { display: block; }
      .card { display: block; width: 420px; padding: 16px; border: 1px solid #ccc; margin-bottom: 16px; }
      .row { display: block; margin: 10px 0; }
      .summary { display: block; width: 300px; padding: 12px; background: #f6f6f6; }
      .line { display: block; }
      .total { display: block; font-weight: bold; }
    </style>
  </head>
  <body>
    <main class="cols">
      <h1>Checkout</h1>
      <form id="pay" action="/pay" method="post">
        <section class="card">
          <h2>Contact</h2>
          <div class="row">
            <label for="fullname">Full name</label>
            <input id="fullname" name="name" autocomplete="name" />
          </div>
          <div class="row">
            <label for="mail">Email</label>
            <input id="mail" name="email" type="email" autocomplete="email" />
          </div>
          <div class="row">
            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" />
          </div>
        </section>
        <section class="card">
          <h2>Shipping address</h2>
          <div class="row">
            <label for="addr1">Address</label>
            <input id="addr1" name="address1" autocomplete="shipping address-line1" />
          </div>
          <div class="row">
            <label for="addr2">Apartment, suite (optional)</label>
            <input id="addr2" name="address2" autocomplete="shipping address-line2" />
          </div>
          <div class="row">
            <label for="city">City</label>
            <input id="city" name="city" autocomplete="shipping address-level2" />
          </div>
          <div class="row">
            <label for="state">State</label>
            <select id="state" name="state" autocomplete="shipping address-level1">
              <option value="">Choose…</option>
              <option value="CA">California</option>
              <option value="NY">New York</option>
              <option value="TX">Texas</option>
              <option value="WA">Washington</option>
            </select>
          </div>
          <div class="row">
            <label for="zip">ZIP code</label>
            <input id="zip" name="zip" autocomplete="shipping postal-code" />
          </div>
          <div class="row">
            <label for="country">Country</label>
            <select id="country" name="country" autocomplete="shipping country">
              <option value="">Choose…</option>
              <option value="CA">Canada</option>
              <option value="GB">United Kingdom</option>
              <option value="US">United States</option>
            </select>
          </div>
        </section>
        <section class="card">
          <h2>Payment</h2>
          <div class="row">
            <label for="ccname">Name on card</label>
            <input id="ccname" name="ccname" autocomplete="cc-name" />
          </div>
          <div class="row">
            <label for="ccnum">Card number</label>
            <input id="ccnum" name="cardnumber" inputmode="numeric" autocomplete="cc-number" maxlength="19" placeholder="1234 1234 1234 1234" />
          </div>
          <!-- The expiry is split: a month dropdown and a two-digit year box, neither with an autocomplete hint. -->
          <div class="row">
            <label for="expm">Expiry month</label>
            <select id="expm" name="exp-month">
              <option value="">MM</option>
              <option value="01">01 - January</option>
              <option value="02">02 - February</option>
              <option value="03">03 - March</option>
              <option value="04">04 - April</option>
              <option value="05">05 - May</option>
              <option value="06">06 - June</option>
              <option value="07">07 - July</option>
              <option value="08">08 - August</option>
              <option value="09">09 - September</option>
              <option value="10">10 - October</option>
              <option value="11">11 - November</option>
              <option value="12">12 - December</option>
            </select>
            <label for="expy">Expiry year</label>
            <input id="expy" name="exp-year" inputmode="numeric" maxlength="2" placeholder="YY" />
          </div>
          <div class="row">
            <label for="cvc">Security code</label>
            <input id="cvc" name="cvc" inputmode="numeric" maxlength="4" autocomplete="cc-csc" />
          </div>
        </section>
        <aside class="summary" aria-label="Order summary">
          <div class="line"><span>Widget Pro × 1</span> <span>$45.00</span></div>
          <div class="line"><span>Subtotal</span> <span>$45.00</span></div>
          <div class="line"><span>Shipping</span> <span>$2.50</span></div>
          <div class="line"><span>Tax</span> <span>$3.75</span></div>
          <div class="total"><span>Order total</span> <span id="total">$51.25</span></div>
        </aside>
        <div class="row">
          <label><input type="checkbox" name="save" /> Save this card for next time</label>
        </div>
        <div class="row">
          <button type="submit" id="paybtn">Pay $51.25</button>
          <a href="/cart">Back to cart</a>
        </div>
      </form>
    </main>
    <script>
      document.getElementById("pay").addEventListener("submit", (e) => {
        e.preventDefault();
        document.getElementById("paybtn").textContent = "Paid (test page: nothing was charged)";
      });
    </script>
    <script type="module" src="/harness.js"></script>
  </body>
</html>
