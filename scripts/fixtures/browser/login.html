<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign in — Acme Store</title>
    <style>
      body { font: 16px system-ui, sans-serif; margin: 24px; }
      .bar { display: block; padding: 8px 0; }
      .card { display: block; width: 360px; padding: 16px; border: 1px solid #ccc; }
      .row { display: block; margin: 10px 0; }
      .foot { display: block; margin-top: 40px; color: #555; }
    </style>
  </head>
  <body>
    <header class="bar">
      <a href="/">Acme Store</a>
      <form id="site-search" action="/search" role="search">
        <input type="search" name="q" placeholder="Search products" aria-label="Search products" />
        <button type="submit">Search</button>
      </form>
    </header>
    <main>
      <h1>Sign in</h1>
      <form id="login" class="card" action="/session" method="post">
        <div class="row">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
        </div>
        <div class="row">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <div class="row">
          <label><input type="checkbox" name="remember" /> Keep me signed in</label>
        </div>
        <div class="row">
          <button type="submit" id="go">Sign in</button>
          <a href="/forgot">Forgot your password?</a>
        </div>
      </form>
    </main>
    <footer class="foot">
      <form id="newsletter" action="/newsletter" method="post">
        <label for="news">Get our newsletter</label>
        <input id="news" name="newsletter_email" type="email" placeholder="you@example.com" />
        <button type="submit">Subscribe</button>
      </form>
    </footer>
    <script type="module" src="/harness.js"></script>
  </body>
</html>
