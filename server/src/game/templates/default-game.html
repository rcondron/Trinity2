<!--
  Trinity — default game screen (template contract v1).
  window.render(state, prev) renders a GameView (server/src/game/types.ts). It re-skins itself
  from state.theme, keeps the DOM stable between updates (keyed morph, so bars animate and
  images never flicker), and never throws on missing fields. No network, no web fonts.

<style>
:root {

  --warn: color-mix(in srgb, #eda83c 78%, var(--accent));

  --soft: color-mix(in srgb, var(--ink) 5%, transparent);

  --panel-hi: color-mix(in srgb, var(--panel) 91%, var(--ink));

  --radius: 16px;
  --radius-sm: 11px;
  --gap: 14px;
  --pad: 18px;
  color-scheme: dark;
}
:root[data-tone="light"] {
  color-scheme: light;
  --shadow: 0 14px 30px -22px rgba(40, 30, 10, .45), 0 2px 6px -3px rgba(40, 30, 10, .2);
  --line: color-mix(in srgb, var(--ink) 13%, transparent);
  --line-2: color-mix(in srgb, var(--ink) 22%, transparent);
}
* { box-sizing: border-box; }

/* ── Frame & layout ───────────────────────────────────────────────────────── */

.is-free .log { max-height: 460px; }
.is-free .npcs, .is-free .items { max-height: 380px; }
.row2 { display: grid; grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr); gap: 12px; align-items: stretch; }
.row2 > .panel { display: flex; flex-direction: column; }

.row2.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }

/* ── Header ───────────────────────────────────────────────────────────────── */

.hdr-art { width: 62px; height: 62px; border-radius: 15px; box-shadow: 0 0 0 1px var(--accent-line), 0 8px 22px -10px rgba(0, 0, 0, .8); }
.hdr-main { flex: 1 1 auto; min-width: 0; }

.hdr-right { flex: none; display: flex; align-items: center; gap: 10px; }
.phase { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid; font: 700 11px/1 var(--font-label); letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; }
.phase b { font-weight: 800; letter-spacing: .06em; opacity: .85; }

.ph-play { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); background: color-mix(in srgb, var(--good) 11%, transparent); }

/* ── Panels & section heads ───────────────────────────────────────────────── */
.panel { position: relative; min-width: 0; border-radius: var(--radius); border: 1px solid var(--line);
  background-color: var(--panel); background-image: linear-gradient(180deg, var(--panel-hi), var(--panel) 150px);

.ph .here { flex: 0 1 auto; min-width: 0; max-width: 58%; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font: 600 12px/1.2 var(--font-ui); letter-spacing: 0; text-transform: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph .here i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec > .ph { padding: 2px 4px 0; }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px; padding: 16px 18px 22px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.45; }
.empty svg { width: 26px; height: 26px; color: var(--accent); opacity: .6; }
.empty b { color: var(--ink); font-weight: 600; font-size: 13.5px; opacity: .88; }
.fail { padding: 14px 16px; color: var(--muted); font-size: 12.5px; font-style: italic; }

/* ── Images: shimmer → fade-in → fallback ─────────────────────────────────── */
.pic { position: relative; flex: none; overflow: hidden; isolation: isolate; background: var(--panel-lo); }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1.04); transition: opacity .7s ease, transform 1.4s cubic-bezier(.2, .8, .2, 1); }
.pic img.is-loaded { opacity: 1; transform: none; }
.shim { position: absolute; inset: 0; overflow: hidden; background: color-mix(in srgb, var(--ink) 8%, transparent); }
.shim::after, .skel::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(100deg, transparent 15%, color-mix(in srgb, var(--ink) 17%, transparent) 50%, transparent 85%); animation: shim 1.5s ease-in-out infinite; }
img.is-loaded + .shim { display: none; }
.pic-note { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font: italic 14px/1.3 var(--font-theme); text-align: center; z-index: 1; }
.pic-note svg { width: 24px; height: 24px; color: var(--accent); opacity: .75; animation: bob 2.4s ease-in-out infinite; }
.ini { position: absolute; inset: 0; display: grid; place-items: center; color: #fff8ee; font: 700 calc(var(--s, 56px) * .36)/1 var(--font-theme); letter-spacing: .02em; text-shadow: 0 1px 3px rgba(0, 0, 0, .45);
  background: radial-gradient(circle at 32% 26%, hsl(var(--h, 30) 44% 46%), hsl(var(--h, 30) 40% 21%) 78%); }
.glyph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--r, var(--accent)); background: radial-gradient(circle at 50% 38%, color-mix(in srgb, var(--r, var(--accent)) 24%, var(--panel)), var(--panel-lo) 78%); }
.glyph svg { width: 52%; height: 52%; }
.glyph.big { font: 400 28px/1 var(--font-theme); }
</style>
<style>

.pc { position: relative; min-width: 0; padding: 14px; border-radius: var(--radius); border: 1px solid var(--line);
  background-color: var(--panel); background-image: linear-gradient(160deg, var(--panel-hi), var(--panel) 65%);
  box-shadow: var(--shadow); transition: border-color .4s ease, box-shadow .4s ease, opacity .4s ease, background-color .7s ease; }
.pc.is-active { border-color: color-mix(in srgb, var(--accent) 72%, transparent); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 30px -8px var(--accent), var(--shadow); }

.pc-id { flex: 1 1 auto; min-width: 0; }
.pc-name { font: 700 17px/1.2 var(--font-theme); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-sub { margin-top: 3px; color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-sub b { color: var(--accent); font-weight: 700; }
.ac { position: relative; flex: none; width: 40px; height: 44px; display: grid; place-items: center; color: var(--accent); }
.ac svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: color-mix(in srgb, var(--accent) 13%, var(--panel)); stroke: currentColor; stroke-width: 1.5; }
.ac b { position: relative; margin-top: -3px; font: 800 15px/1 var(--font-ui); color: var(--ink); font-variant-numeric: tabular-nums; }

.hp-row { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
.hp-l { flex: none; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font: 800 10px/1 var(--font-label); letter-spacing: .14em; }
.hp-l svg { width: 13px; height: 13px; color: var(--danger); }
.hp { position: relative; flex: 1 1 auto; height: 10px; border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--ink) 9%, transparent); box-shadow: inset 0 1px 2px rgba(0, 0, 0, .35); }
.hp i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--c) 68%, #000), var(--c)); box-shadow: 0 0 12px -2px var(--c); transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.hp i::after { content: ""; position: absolute; inset: 0 0 50% 0; border-radius: inherit; background: linear-gradient(180deg, rgba(255, 255, 255, .3), transparent); }
.hp-n { flex: none; min-width: 56px; text-align: right; font: 800 14px/1 var(--font-ui); font-variant-numeric: tabular-nums; }
.hp-n small { color: var(--muted); font-weight: 600; font-size: 11.5px; }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; margin-top: 12px; }
.st { min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 5px 0 5px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); }
.st span { font: 800 8.5px/1 var(--font-label); letter-spacing: .12em; color: var(--muted); }

.tag.bad { color: color-mix(in srgb, var(--danger) 78%, var(--ink)); border-color: color-mix(in srgb, var(--danger) 42%, transparent); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.tag.boon { color: color-mix(in srgb, var(--good) 78%, var(--ink)); border-color: color-mix(in srgb, var(--good) 42%, transparent); background: color-mix(in srgb, var(--good) 12%, transparent); }

.lore { margin-top: 10px; color: var(--muted); font: italic 13px/1.45 var(--font-theme); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.d1 .lore, .d1 .st em { display: none; }
.d1 .st { padding: 4px 0; }
.d2 .pc { padding: 12px; }
.d2 .av { width: 48px; height: 48px; --s: 48px; }
.d2 .lore, .d2 .inv, .d2 .purse, .d2 .st em { display: none; }

.d2 .st { padding: 4px 0; }

  background-image: linear-gradient(100deg, var(--ink) 0%, var(--ink) 38%, color-mix(in srgb, var(--accent) 85%, #fff) 50%, var(--ink) 62%, var(--ink) 100%); animation: textshine 3.4s ease-in-out infinite; }

      ctx.globalAlpha = 0.5;
      ctx.fillStyle = rgba(C.accent, 0.9);
      ctx.strokeStyle = rgba(C.accent, 0.9);
      ctx.lineWidth = 1;
      for (i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(3.2, -3.2); ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(-3.2, -3.2); ctx.lineTo(0, 0); ctx.closePath(); ctx.stroke();
        ctx.rotate(Math.PI / 2);
      }
      ctx.globalAlpha = 0.7;
      ctx.font = "700 8px " + FONTS.sans;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("N", 0, -21);
      ctx.restore();
    }
    if (note) note.textContent = locs.length ? "" : space ? "No systems charted yet" : "Uncharted — the map fills in as you explore";
    if (!locs.length) { if (ring) ring.classList.remove("on"); return; }
    var padX = 30, padT = 22, padB = 30, pts = {};
    locs.forEach(function (l) { pts[l.id] = { x: padX + l.x * (w - padX * 2), y: padT + l.y * (h - padT - padB), l: l }; });
    // Routes
    var drawn = {};
    ctx.lineCap = "round";
    locs.forEach(function (l) {
      l.connections.forEach(function (cid) {
        var a = pts[l.id], b = pts[cid];
        if (!b || cid === l.id) return;
        var key = l.id < cid ? l.id + "\u0001" + cid : cid + "\u0001" + l.id;
        if (drawn[key]) return;
        drawn[key] = true;
        var both = a.l.visited && b.l.visited, hot = l.id === cur || cid === cur;
        ctx.save();
        ctx.strokeStyle = rgba(both ? C.accent : C.muted, both ? (space ? 0.6 : 0.7) : 0.42);
        ctx.lineWidth = hot ? 2.2 : 1.6;
        if (!both) ctx.setLineDash(space ? [2, 5] : [5, 5]);
        if (space && both) { ctx.shadowColor = rgba(C.accent, 0.8); ctx.shadowBlur = 6; }
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        if (space) ctx.lineTo(b.x, b.y);
        else {
          var dx = b.x - a.x, dy = b.y - a.y, len = Math.sqrt(dx * dx + dy * dy) || 1;
          var bend = Math.min(16, len * 0.14) * (hash(key) % 2 ? 1 : -1);
          ctx.quadraticCurveTo((a.x + b.x) / 2 - (dy / len) * bend, (a.y + b.y) / 2 + (dx / len) * bend, b.x, b.y);
        }
        ctx.stroke();
        ctx.restore();
      });
    });
    // Places
    locs.forEach(function (l) {
      var p = pts[l.id], isCur = l.id === cur, r = isCur ? 7 : l.visited ? 5.5 : 4.5;
      ctx.save();
      if (isCur) {
        var glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 28);
        glow.addColorStop(0, rgba(C.accent, 0.5));
        glow.addColorStop(1, rgba(C.accent, 0));
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.arc(p.x, p.y, 28, 0, Math.PI * 2); ctx.fill();
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      if (l.visited || isCur) {
        ctx.fillStyle = rgba(isCur ? C.accent : space ? C.accent2 : C.accent, isCur ? 1 : 0.88);
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = rgba(C.bg, 0.95);
        ctx.stroke();
      } else {
        ctx.fillStyle = rgba(C.panel, 1);
        ctx.fill();
        ctx.lineWidth = 1.5;
        ctx.setLineDash([2, 2]);
        ctx.strokeStyle = rgba(C.muted, 0.9);
        ctx.stroke();
      }
      if (space && (l.visited || isCur)) {
        ctx.setLineDash([]);
        ctx.strokeStyle = rgba(isCur ? C.accent : C.accent2, 0.6);
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, r + 5, (r + 5) * 0.36, -0.42, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    });
    // Labels: current first, then visited; skip any that would collide.
    var boxes = [], font = FONTS[s.theme.font] || FONTS.serif;
    var hits = locs.map(function (l) { var p = pts[l.id]; return { id: l.id, x: p.x - 8, y: p.y - 8, w: 16, h: 16 }; });
    var overlap = function (a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; };
    var rank = function (l) { return l.id === cur ? 2 : l.visited ? 1 : 0; };
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    locs.slice().sort(function (a, b) { return rank(b) - rank(a); }).forEach(function (l) {
      var p = pts[l.id], isCur = l.id === cur;
      var name = l.name || "Unknown";
      if (name.length > 24) name = name.slice(0, 23) + "…";
      var label = space ? name.toUpperCase() : name;
      ctx.font = space ? (isCur ? "700 " : "600 ") + "10px " + FONTS.mono : (isCur ? "italic 700 " : "italic ") + "12.5px " + font;
      var tw = ctx.measureText(label).width, th = space ? 11 : 14, r = isCur ? 7 : 5;
      var cands = [[p.x - tw / 2, p.y + r + 11], [p.x - tw / 2, p.y - r - 11], [p.x + r + 8, p.y], [p.x - r - 8 - tw, p.y]];
      var spot = null, k;
      for (k = 0; k < cands.length && !spot; k++) {
        var x = Math.max(4, Math.min(w - 4 - tw, cands[k][0])), y = Math.max(th / 2 + 3, Math.min(h - th / 2 - 3, cands[k][1]));
        var box = { x: x - 3, y: y - th / 2 - 2, w: tw + 6, h: th + 4 };
        var clash = boxes.some(function (b) { return overlap(b, box); }) || hits.some(function (b) { return b.id !== l.id && overlap(b, box); });
        if (!clash) spot = { x: x, y: y, box: box };
      }
      if (!spot) {
        if (!isCur) return;
        var x0 = Math.max(4, Math.min(w - 4 - tw, cands[0][0])), y0 = Math.max(th / 2 + 3, Math.min(h - th / 2 - 3, cands[0][1]));
        spot = { x: x0, y: y0, box: { x: x0 - 3, y: y0 - th / 2 - 2, w: tw + 6, h: th + 4 } };
      }
      boxes.push(spot.box);
      ctx.lineJoin = "round";
      ctx.lineWidth = 4;
      ctx.strokeStyle = rgba(C.bg, 0.82);
      ctx.strokeText(label, spot.x, spot.y);
      ctx.fillStyle = isCur ? rgba(C.ink, 1) : l.visited ? rgba(C.ink, 0.86) : rgba(C.muted, 0.9);
      ctx.fillText(label, spot.x, spot.y);
    });
    var cp = cur ? pts[cur] : null;
    if (ring) {
      if (cp) { ring.style.left = cp.x + "px"; ring.style.top = cp.y + "px"; ring.classList.add("on"); }
      else ring.classList.remove("on");
    }
  }

  // ── Layout & render loop ───────────────────────────────────────────────────
  var S = null, lay = null, lastRaw = null, firstDone = false, failures = 0;
  function computeLayout() {
    var w = window.innerWidth || docEl.clientWidth || 1280, h = window.innerHeight || docEl.clientHeight || 800;
    var L = w >= 1120 ? "wide" : w >= 900 ? "mid" : "narrow";
    return { L: L, free: L !== "narrow" && h < 600, tiny: w < 560, h: h };
  }
  function setLayoutClasses(l) {
    var cl = app.classList;
    cl.toggle("L-wide", l.L === "wide");
    cl.toggle("L-mid", l.L === "mid");
    cl.toggle("L-narrow", l.L === "narrow");
    cl.toggle("is-free", l.free);
    cl.toggle("tiny", l.tiny);
  }
  function fitParty(l) {
    if (l.L === "narrow" || l.free || density >= 3) return false;
    var col = app.querySelector(".col-party");
    // No layout yet (the first render can run while the frame is still loading): the
    // ResizeObserver on #app re-renders once real sizes exist.
    if (!col || !col.clientHeight || col.scrollHeight <= col.clientHeight + 4) return false;
    density += 1;
    return true;
  }
  function markLoaded() {
    var imgs = app.querySelectorAll("img:not(.is-loaded)");
    for (var i = 0; i < imgs.length; i++) {
      var im = imgs[i];
      if (im.complete && im.naturalWidth > 0) { loaded.add(im.getAttribute("src")); im.classList.add("is-loaded"); }
    }
  }
  function draw(raw) {
    var s = norm(raw);
    applyTheme(s.theme);
    if (isSpace(s)) app.setAttribute("data-space", ""); else app.removeAttribute("data-space");
    var l = computeLayout();
    setLayoutClasses(l);
    var prev = S, gameChanged = !!(prev && prev.id !== s.id);
    var dk = [s.id, s.players.length, l.L, l.free, Math.round(l.h / 24)].join("|");
    if (dk !== densityKey) { densityKey = dk; density = 0; }
    S = s;
    lay = l;
    indexes(s);
    morphInto(app, buildBoard(s, l, !firstDone || gameChanged));
    // Safety net: a placeholder that found no live twin means the cache was wrong — redo fully.
    if (app.querySelector("[data-same]")) morphInto(app, buildBoard(s, l, true));
    for (var n = 0; n < 3 && fitParty(l); n++) morphInto(app, buildBoard(s, l));
    markLoaded();
    if (prev && !gameChanged && firstDone) {
      try { effects(s, prev); } catch (err) { warn("effects failed", err); }
    } else if (gameChanged) {
      restartFx(app.querySelector(".board"), "fx-swap");
    }
    syncRoll(s, firstDone && !gameChanged && !!prev);
    observeMap();
    drawMapSoon();
    if (!firstDone) {
      firstDone = true;
      var show = function () { app.classList.add("is-ready"); };
      try { requestAnimationFrame(show); } catch (e) { /* timer below */ }
      setTimeout(show, 80);
    }
  }
  function safeDraw(raw) {
    try {
      draw(raw);
      failures = 0;
    } catch (err) {
      failures += 1;
      warn("render failed", err);
      // Keep the last good screen through a one-off glitch; let the host fall back if it persists.
      if (failures >= 2 || !firstDone) throw err;
    }
  }
  var redrawTimer = 0;
  function scheduleRedraw(delay) {
    if (redrawTimer) return;
    redrawTimer = setTimeout(function () {
      redrawTimer = 0;
      // A persistent failure propagates to the runtime's error reporter (host falls back).
      if (lastRaw !== null) safeDraw(lastRaw);
    }, delay || 30);
  }

  // Images: fade in once decoded; fall back to initials/glyphs if a URL fails.
  document.addEventListener("load", function (e) {
    var t = e.target;
    if (!t || t.tagName !== "IMG") return;
    var src = t.getAttribute("src");
    if (src) loaded.add(src);
    t.classList.add("is-loaded");
  }, true);
  document.addEventListener("error", function (e) {
    var t = e.target;
    if (!t || t.tagName !== "IMG") return;
    var src = t.getAttribute("src");
    if (src && !failed.has(src)) { failed.add(src); scheduleRedraw(); }
  }, true);
  // Transient effect classes remove themselves when their animation ends.
  document.addEventListener("animationend", function (e) {
    var t = e.target;
    var name = e.animationName || "";
    if (t && t.classList && name.lastIndexOf("fx-", 0) === 0 && t.classList.contains(name)) t.classList.remove(name);
  }, true);
  // Re-layout when the frame gets its real size (first paint) or is resized.
  var appSize = "";
  function onAppResize() {
    var r = app.getBoundingClientRect(), key = Math.round(r.width) + "x" + Math.round(r.height);
    if (key === appSize) return;
    appSize = key;
    if (r.width && r.height) scheduleRedraw(40);
  }
  try {
    if (typeof ResizeObserver === "function") new ResizeObserver(function () { try { onAppResize(); } catch (e) { /* ignore */ } }).observe(app);
  } catch (e) { /* window resize below still works */ }
  window.addEventListener("resize", function () { scheduleRedraw(60); });

  /** Template contract v1 entry point. */
  window.render = function (state, prev) {
    lastRaw = state === undefined ? null : state;
    safeDraw(lastRaw);
  };
})();
</script>
