<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Workspace frames are srcdoc documents: no frame may navigate anywhere (a page could carry data out in the URL). -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trinity</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="orb" id="orb"></span>
        <h1>Trinity</h1>
        <select class="persona-select" id="personaSelect" title="Switch persona"></select>
      </div>
      <div class="status" id="statusChips"></div>
      <a class="ghost settings-link" id="settingsBtn" href="/settings.html" target="trinity-settings" title="Open settings">⚙ Settings</a>
    </header>

    <main class="panes" id="panes">
      <!-- TALK -->
      <section class="pane talk">
        <div class="talk-inner">
          <button class="mic" id="micBtn" aria-label="Talk">
            <span class="mic-icon">🎙</span>
            <span class="mic-label" id="micLabel">Tap to talk</span>
          </button>
          <div class="voice-state" id="voiceState"></div>
          <div class="listening" id="listening"></div>
          <form class="textbar" id="textForm">
            <input id="textInput" placeholder="…or type to Trinity" autocomplete="off" />
            <button type="submit">Send</button>
          </form>
          <p class="hint" id="voiceHint"></p>
        </div>
      </section>

      <!-- TRANSCRIPT (collapsible) -->
      <section class="pane transcript" id="transcriptPane">
        <div class="pane-head">
          <h2>Transcript</h2>
          <button class="ghost small" id="collapseBtn" title="Collapse">⟨⟩</button>
        </div>
        <div class="feed" id="feed"></div>
      </section>

      <!-- WORKSPACE (live; can pop out into its own window) -->
      <section class="pane workspace" id="workspacePane">
        <div class="pane-head">
          <h2 id="workspaceTitle">Workspace</h2>
          <button class="ghost small" id="popoutBtn" title="Open the workspace in its own window">⧉ Pop out</button>
        </div>
        <div class="workspace-host" id="workspaceHost"></div>
        <div class="workspace-away" id="workspaceAway" hidden>
          <div class="away-card">
            <div class="away-icon">⧉</div>
            <div class="away-text">The workspace is open in its own window.</div>
            <div class="away-actions">
              <button class="primary small" id="focusWindowBtn" type="button">Show it</button>
              <button class="ghost small" id="dockBtn" type="button">Bring it back here</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
