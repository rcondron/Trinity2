<!doctype html>
<html lang="en" class="tw-page">
  <head>
    <meta charset="utf-8" />
    <!-- Workspace frames are srcdoc documents: no frame may navigate anywhere (a page could carry data out in the URL). -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0c0c14" />
    <title>Trinity — Workspace</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3CradialGradient id='g' cx='35%25' cy='32%25' r='75%25'%3E%3Cstop offset='0' stop-color='%2367e8f9'/%3E%3Cstop offset='.6' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%234c1d95'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='url(%23g)'/%3E%3C/svg%3E"
    />
    <style>
      /* Paint the dark background before the module (and its stylesheet) loads — no white flash. */
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0c0c14;
        color: #e9e9f2;
      }
      body {
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="workspace-root" class="tw-page-root"></div>
    <noscript>
      <p style="font: 14px system-ui, sans-serif; padding: 24px; color: #9494b4">
        The Trinity workspace needs JavaScript to show what Trinity builds.
      </p>
    </noscript>
    <script type="module" src="/src/workspace/window.ts"></script>
  </body>
</html>
